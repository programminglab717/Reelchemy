name: reelchemy
x-auth-environment: &auth
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set an HTTPS authentication URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a strong authentication signing secret}
  EMAIL_DELIVERY: smtp
  SMTP_HOST: ${SMTP_HOST:?Set an SMTP host}
  EMAIL_FROM: ${EMAIL_FROM:?Set the account sender address}
  REELCHEMY_AUTH_DIR: /app/private-auth
x-media-environment: &media
  REELCHEMY_MEDIA_STORAGE_BYTES: ${REELCHEMY_MEDIA_STORAGE_BYTES:-536870912}
  REELCHEMY_MEDIA_INPUT_SLOTS: ${REELCHEMY_MEDIA_INPUT_SLOTS:-4}
  REELCHEMY_MEDIA_INPUTS_PER_STUDIO: ${REELCHEMY_MEDIA_INPUTS_PER_STUDIO:-1}
  REELCHEMY_MEDIA_ANALYSIS_SLOTS: ${REELCHEMY_MEDIA_ANALYSIS_SLOTS:-16}
  REELCHEMY_MEDIA_ANALYSES_PER_STUDIO: ${REELCHEMY_MEDIA_ANALYSES_PER_STUDIO:-4}
  REELCHEMY_MEDIA_RAW_BYTES: ${REELCHEMY_MEDIA_RAW_BYTES:-268435456}
  REELCHEMY_WAVEFORMS_PER_HOUR: ${REELCHEMY_WAVEFORMS_PER_HOUR:-120}
x-project-environment: &projectdata
  REELCHEMY_PROJECT_DATA_BYTES: ${REELCHEMY_PROJECT_DATA_BYTES:-33554432}
  REELCHEMY_STUDIO_DATA_BYTES: ${REELCHEMY_STUDIO_DATA_BYTES:-268435456}
  REELCHEMY_SERVICE_DATA_BYTES: ${REELCHEMY_SERVICE_DATA_BYTES:-4294967296}
  REELCHEMY_STUDIO_PROJECTS: ${REELCHEMY_STUDIO_PROJECTS:-500}
  REELCHEMY_SERVICE_PROJECTS: ${REELCHEMY_SERVICE_PROJECTS:-20000}
  REELCHEMY_PROJECT_VERSIONS: ${REELCHEMY_PROJECT_VERSIONS:-10000}
  REELCHEMY_PROJECT_MESSAGES: ${REELCHEMY_PROJECT_MESSAGES:-10000}
x-runtime: &runtime
  image: reelchemy:local
  build:
    context: .
    target: app
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  volumes:
    - studio-data:/app/.data
    - studio-artifacts:/app/artifacts
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=2g,uid=1000,gid=1000,mode=1777
    - /app/node_modules/.cache:rw,nosuid,noexec,size=256m,uid=1000,gid=1000
    - /app/.next/cache:rw,nosuid,noexec,size=128m,uid=1000,gid=1000
  environment: &paths
    REELCHEMY_DATA_DIR: /app/.data
    REELCHEMY_ARTIFACT_DIR: /app/artifacts
    CHROMIUM_PATH: /usr/bin/chromium
    RAYON_NUM_THREADS: "2"
services:
  migrate:
    <<: *runtime
    command: [npm, run, db:migrate]
    restart: "no"
    network_mode: none
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      disable: true
    environment:
      <<: [*paths, *auth]
    volumes:
      - studio-data:/app/.data
      - studio-artifacts:/app/artifacts
      - studio-auth:/app/private-auth
  web:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    ports:
      - "127.0.0.1:${REELCHEMY_HTTP_PORT:-3001}:3000"
    volumes:
      - studio-data:/app/.data
      - studio-artifacts:/app/artifacts
      - studio-auth:/app/private-auth
    environment:
      <<: [*paths, *auth, *media, *projectdata]
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      REELCHEMY_AI_INPUT_USD_PER_MILLION: ${REELCHEMY_AI_INPUT_USD_PER_MILLION:-}
      REELCHEMY_AI_OUTPUT_USD_PER_MILLION: ${REELCHEMY_AI_OUTPUT_USD_PER_MILLION:-}
      REELCHEMY_AI_CACHE_READ_USD_PER_MILLION: ${REELCHEMY_AI_CACHE_READ_USD_PER_MILLION:-}
      REELCHEMY_AI_CACHE_WRITE_USD_PER_MILLION: ${REELCHEMY_AI_CACHE_WRITE_USD_PER_MILLION:-}
      REELCHEMY_AI_GLOBAL_USD_PER_DAY: ${REELCHEMY_AI_GLOBAL_USD_PER_DAY:-20}
      REELCHEMY_AI_STUDIO_USD_PER_DAY: ${REELCHEMY_AI_STUDIO_USD_PER_DAY:-2}
      REELCHEMY_AI_CONCURRENT_CALLS: ${REELCHEMY_AI_CONCURRENT_CALLS:-2}
      REELCHEMY_AI_CALLS_PER_STUDIO: ${REELCHEMY_AI_CALLS_PER_STUDIO:-1}
      REELCHEMY_AI_MAX_PAYLOAD_BYTES: ${REELCHEMY_AI_MAX_PAYLOAD_BYTES:-131072}
      REELCHEMY_AI_LEDGER_MAX_REQUESTS: ${REELCHEMY_AI_LEDGER_MAX_REQUESTS:-100000}
      REELCHEMY_WRITES_PER_MINUTE: ${REELCHEMY_WRITES_PER_MINUTE:-120}
      REELCHEMY_MEDIA_REQUESTS_PER_HOUR: ${REELCHEMY_MEDIA_REQUESTS_PER_HOUR:-30}
      REELCHEMY_PLANS_PER_DAY: ${REELCHEMY_PLANS_PER_DAY:-60}
      REELCHEMY_EXPORT_REQUESTS_PER_DAY: ${REELCHEMY_EXPORT_REQUESTS_PER_DAY:-30}
      REELCHEMY_ACTIVE_EXPORTS_PER_STUDIO: ${REELCHEMY_ACTIVE_EXPORTS_PER_STUDIO:-2}
  ingest:
    <<: *runtime
    command: [npm, run, ingest:worker]
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    network_mode: none
    volumes:
      - studio-data:/app/.data
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/check-ingest.ts]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      <<: [*media, *projectdata]
      REELCHEMY_DATA_DIR: /app/.data
      RAYON_NUM_THREADS: "2"
  render:
    <<: *runtime
    command: [npm, run, worker]
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    network_mode: none
    shm_size: 512m
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/check-worker.ts]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      <<: *paths
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      REELCHEMY_SCENE_CACHE_BYTES: ${REELCHEMY_SCENE_CACHE_BYTES:-1073741824}
      REELCHEMY_SCENE_CACHE_BYTES_PER_STUDIO: ${REELCHEMY_SCENE_CACHE_BYTES_PER_STUDIO:-268435456}
      REELCHEMY_SCENE_CACHE_ENTRIES: ${REELCHEMY_SCENE_CACHE_ENTRIES:-5000}
      REELCHEMY_SCENE_CACHE_DAYS: ${REELCHEMY_SCENE_CACHE_DAYS:-7}
  mail:
    <<: *runtime
    profiles: [smtp]
    command: [npm, run, mail:worker]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      disable: true
    volumes:
      - studio-auth:/app/private-auth
    environment:
      <<: *paths
      EMAIL_DELIVERY: smtp
      REELCHEMY_AUTH_DIR: /app/private-auth
      SMTP_HOST: ${SMTP_HOST:?Set an SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set the account sender address}
volumes:
  studio-data:
  studio-artifacts:
  studio-auth:
