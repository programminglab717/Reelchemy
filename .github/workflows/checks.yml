name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AI_PROVIDER: mock
      EMAIL_DELIVERY: file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install media/browser/backup prerequisites
        # A stalled package mirror once held this step for 40 minutes; fail
        # fast instead of consuming the whole job budget.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation restic util-linux
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(`CHROMIUM_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      # The complete browser regression runs once, against the production
      # build inside the immutable test image (production job). Development
      # mode compiles routes on first use and renders without the prepared
      # renderer, so the full suite exceeds this job's budget on hosted
      # runners; keep a fast source-mode smoke of everyday creator workflows.
      - name: Source-mode browser smoke with synthetic accounts
        run: >-
          npm run test:isolated --
          tests/e2e/health.spec.ts
          tests/e2e/editor.spec.ts
          tests/e2e/interface.spec.ts
          tests/e2e/typography.spec.ts
          tests/e2e/brand-font.spec.ts
          tests/e2e/ai-provider.spec.ts
          tests/e2e/motion.spec.ts
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            /tmp/reelchemy-e2e-*/app/test-results/
            /tmp/reelchemy-e2e-*/services.log
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Build the disposable production-check image
        run: node scripts/container-build.ts --target test --tag reelchemy:checks
      - name: Build the production service image from the same source
        run: node scripts/container-build.ts --target app --tag reelchemy:runtime-checks
      - name: Build the isolated backup operator image
        run: node scripts/container-build.ts --target backup --tag reelchemy:backup-checks
      - name: Encrypted repository and retention workflows without service credentials
        run: >-
          docker run --rm --network none --read-only
          --cpus 2 --memory 2g --pids-limit 128
          --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,exec,nosuid,nodev,uid=1000,gid=1000,mode=700,size=512m
          reelchemy:backup-checks
          node --import tsx scripts/test-unit.ts tests/encrypted-backup.test.ts
      - name: Production HTTPS, private accounts and real media workflows
        run: >-
          docker run --name reelchemy-production-checks --network none
          --cpus 4 --memory 6g --pids-limit 512 --shm-size 512m
          -e E2E_EVIDENCE_DIR=/app/artifacts/test-evidence
          reelchemy:checks
      - name: Collect isolated evidence
        if: always()
        continue-on-error: true
        run: |
          docker logs reelchemy-production-checks > production-checks.log 2>&1
          docker cp reelchemy-production-checks:/app/artifacts/test-evidence ./production-test-evidence
      - name: Remove the HTTPS check container before service checks
        if: always()
        run: docker rm -f reelchemy-production-checks
      - name: Read-only services, real export and forced container-crash recovery
        run: node scripts/check-runtime.ts --image reelchemy:runtime-checks
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          retention-days: 7
          path: |
            production-checks.log
            production-test-evidence/
            /tmp/reelchemy-runtime-*/report.json
            /tmp/reelchemy-runtime-*/services.log
            /tmp/reelchemy-runtime-*/readiness.json
            /tmp/reelchemy-runtime-*/internal-readiness.json
